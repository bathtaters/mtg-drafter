# !! This workflow requires podman & rsync installed on the remote host !! #

name: Build & Deploy

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      # Defaults to DEV (For testing workflow)
      proc_name:
        required: true
        type: string
        default: "mtg-drafter-test"
      db_name:
        required: true
        type: string
        default: "mtgdrafter_dev"
      remote_port:
        required: true
        type: number
        default: 3041

env:
  # Default to PROD (For push/pull workflow)
  PROC_NAME: ${{ inputs.proc_name || 'mtg-drafter' }}
  DB_NAME: ${{ inputs.db_name || 'mtgdrafter' }}
  REMOTE_PORT: ${{ inputs.remote_port || 3040 }}
  REMOTE_DIR: /tmp

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@main
      
      - name: Install Node.js
        uses: actions/setup-node@main
        with:
          node-version-file: '.nvmrc'
      
      - name: Install Podman
        run: |
          if ! command -v podman &> /dev/null; then
            sudo apt-get install -y podman
          fi
      
      - name: Generate package-lock
        run: npm i --package-lock-only
      
      - name: Get Node.js version
        id: node_version
        run: echo "NODE_VERSION=$(node --version | grep --color=never -o -E '[0-9]+(\.[0-9]+)*')" >> $GITHUB_OUTPUT

      - name: Copy .env
        run: echo 'DATABASE_URL="${{ secrets.DB_BASE_URL }}/'$DB_NAME'?${{ vars.DB_OPTIONS }}"' > .env.tmp
      
      - name: Fix for podman cache
        # Fixes permissions error during cleanup
        run: |
          sudo mv -fv /usr/bin/tar /usr/bin/tar.orig
          echo -e '#!/bin/sh\n\nsudo /usr/bin/tar.orig "$@"' | sudo tee -a /usr/bin/tar
          sudo chmod +x /usr/bin/tar

      - name: Cache podman-machine
        uses: actions/cache@main
        with:
          path: |
            ~/.local/share/containers
            ~/.config/containers
          key: ${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('package.json') }}
    
      - name: Build image
        run: podman build --build-arg ENV_FILE=.env.tmp --build-arg NODE_VERSION=${{ steps.node_version.outputs.NODE_VERSION }} -t $PROC_NAME .

      - name: Compress image
        run: podman save -o $PROC_NAME.tar $PROC_NAME

      - name: Upload image
        uses: actions/upload-artifact@main
        with:
          name: $PROC_NAME-image
          path: $PROC_NAME.tar

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image
        uses: actions/download-artifact@main
        with:
          name: $PROC_NAME-image
          path: .
      
      - name: Install SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.REMOTE_HOST }} > ~/.ssh/known_hosts

      - name: Copy image to host
        run: rsync -cvz $PROC_NAME.tar ${{ vars.REMOTE_USER }}@${{ vars.REMOTE_HOST }}:$REMOTE_DIR/
        
      - name: Remove old container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.REMOTE_USER }}@${{ vars.REMOTE_HOST }} << 'EOF'
          podman stop -i $PROC_NAME
          podman rm -i $PROC_NAME
          podman rmi -i $PROC_NAME
          EOF
      
      - name: Deploy new container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.REMOTE_USER }}@${{ vars.REMOTE_HOST }} << 'EOF'
          podman load -i $REMOTE_DIR/$PROC_NAME.tar
          podman run --memory 512m -d --name $PROC_NAME -p $REMOTE_PORT:3000 $PROC_NAME
          EOF
      
      - name: Cleanup images
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.REMOTE_USER }}@${{ vars.REMOTE_HOST }} << 'EOF'
          rm -f $REMOTE_DIR/$PROC_NAME.tar
          podman image prune -a -f
          EOF
